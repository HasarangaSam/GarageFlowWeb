name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  client-ci:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        working-directory: ./client
        run: npm ci

      - name: Run Unit Tests (Vitest)
        working-directory: ./client
        run: npm test

      - name: Enforce test coverage
        working-directory: ./client
        run: npm run test:coverage

      - name: Run ESLint
        working-directory: ./client
        run: npm run lint

      - name: Dependency audit
        working-directory: ./client
        run: npm audit --audit-level=high

      - name: Build Frontend Application
        working-directory: ./client
        run: npm run build

  server-ci:
    name: Backend Quality & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/garageflow?schema=public"
      ACCESS_TOKEN_SECRET: "ci-access-token-secret-minimum-32-characters-long"
      REFRESH_TOKEN_SECRET: "ci-refresh-token-secret-minimum-32-characters-long"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: garageflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d garageflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        working-directory: ./server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./server
        run: npx prisma generate

      - name: Apply database migrations
        working-directory: ./server
        run: npx prisma migrate deploy

      - name: Run Unit Tests (Vitest)
        working-directory: ./server
        run: npm test

      - name: Build TypeScript Code
        working-directory: ./server
        run: npm run build

      - name: API health integration check
        working-directory: ./server
        run: |
          npm start &
          for attempt in {1..20}; do
            curl --fail --silent http://localhost:5000/api/health && exit 0
            sleep 1
          done
          exit 1

      - name: Dependency audit
        working-directory: ./server
        run: npm audit --audit-level=high

  docker-build:
    name: Docker Container Build
    needs: [client-ci, server-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          load: true
          tags: garageflow-backend:latest

      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: garageflow-backend:latest
          severity: HIGH,CRITICAL
          exit-code: "1"
