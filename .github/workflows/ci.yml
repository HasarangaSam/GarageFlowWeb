name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  client-ci:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        working-directory: ./client
        run: npm ci

      - name: Run Unit Tests (Vitest)
        working-directory: ./client
        run: npm test

      - name: Build Frontend Application
        working-directory: ./client
        run: npm run build

  server-ci:
    name: Backend Quality & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/garageflow?schema=public"
      JWT_SECRET: "ci-secret-key-minimum-32-characters-long"
      JWT_REFRESH_SECRET: "ci-refresh-secret-minimum-32-characters-long"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        working-directory: ./server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./server
        run: npx prisma generate

      - name: Run Unit Tests (Vitest)
        working-directory: ./server
        run: npm test

      - name: Build TypeScript Code
        working-directory: ./server
        run: npm run build

  docker-build:
    name: Docker Container Build
    needs: [client-ci, server-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: garageflow-backend:latest
